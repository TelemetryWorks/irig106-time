version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Owner Dependabot policy 2026-11-16: majors are planned in the
    # coordinator's planned-major-upgrades list.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directories:
      - /
      - /crates/irig106-time
      - /apps/irig106-time-cli
      - /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Owner Dependabot policy 2026-11-16: majors are planned in the
    # coordinator's planned-major-upgrades list.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
