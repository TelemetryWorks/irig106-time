name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (stable)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: cargo test -p irig106-time --all-features
      - run: cargo test -p irig106-time --no-default-features
      - run: cargo test -p irig106-time --features jiff
      - run: cargo test -p irig106-time --no-default-features --features jiff
      - name: CLI transactions on Windows and macOS (Ubuntu covered by CLI job)
        if: matrix.os != 'ubuntu-latest'
        run: cargo test -p irig106-time-cli --lib --test s16_csv_atomic --locked

  msrv:
    name: MSRV Check (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.85.0"
      # The declared MSRV is 1.85 with edition 2024, the same across the
      # IRIG 106 ecosystem (Cargo.toml rust-version; owner, 2026-09-27).
      # Dev-dependencies (criterion, proptest) require newer Rust.
      # MSRV verification uses cargo check on the library only.
      - run: cargo check -p irig106-time --no-default-features
      - run: cargo check -p irig106-time
      - run: cargo check -p irig106-time --no-default-features --features jiff
      - run: cargo check -p irig106-time-cli --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy -p irig106-time --all-targets --all-features -- -D warnings
      - run: python3 -m unittest discover -s scripts -p test_safety_scan.py
      - run: python3 scripts/check-safety-policy.py
      - run: python3 scripts/check-library-no-io.py

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: cargo doc -p irig106-time --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  cli:
    name: CLI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: python3 -m unittest discover -s scripts -p test_cli_workspace.py
      - run: cargo build --manifest-path apps/irig106-time-cli/Cargo.toml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned CLI schema validation tools (dev only)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-schema.txt
      - run: python -m unittest discover -s scripts -p test_report_schema.py
      - name: Validate every live JSON view against the packaged schema
        run: python scripts/validate_cli_reports.py
      - name: Inspect both package file lists (no publication)
        run: |
          cargo package -p irig106-time --list --locked > /tmp/library-package-files.txt
          cargo package -p irig106-time-cli --list --locked > /tmp/cli-package-files.txt
          python3 -c 'from pathlib import Path; files = [set(Path(p).read_text().splitlines()) for p in ["/tmp/library-package-files.txt", "/tmp/cli-package-files.txt"]]; assert all({"README.md", "LICENSE", "Cargo.toml", "src/lib.rs"} <= f for f in files); assert "src/bin/irigtime.rs" in files[1]; assert "schema/irigtime-report-v1.schema.json" in files[1]; assert "tests/fixtures/format2_usage.md" in files[0]'
      - name: Verify crate archives and compile isolated packaged tests
        run: python3 scripts/verify-packages.py
      - run: cargo test --manifest-path apps/irig106-time-cli/Cargo.toml --locked
      - run: python3 -m unittest discover -s scripts -p test_dense_rss.py
      - name: Dense reset + steady F1 six-command RSS (32 MiB ceiling)
        timeout-minutes: 20
        run: python3 scripts/check-dense-rss.py
      - name: Reader and six-command input RSS (generated 384 MiB)
        run: python3 scripts/check-reader-rss.py
      - run: cargo clippy --manifest-path apps/irig106-time-cli/Cargo.toml --all-targets -- -D warnings

  fuzz-check:
    name: Fuzz targets compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # Type-check every harness; no fuzz campaign or nightly instrumentation.
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo build -p irig106-time --target wasm32-unknown-unknown --no-default-features
      - run: cargo build -p irig106-time --target wasm32-unknown-unknown --no-default-features --features jiff

  trace-matrix:
    name: Trace matrix up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/build-trace-matrix.py --check

  deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # deny.toml: known vulnerabilities, unmaintained or yanked crates,
      # licences, duplicate versions, and sources.
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          arguments: --locked --all-features
