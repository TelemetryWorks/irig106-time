[workspace]
members = ["crates/irig106-time", "apps/irig106-time-cli"]
exclude = ["fuzz"]
resolver = "3"

# Both packages inherit this single lockstep version. The shared exact pin
# below is checked against it by scripts/test_cli_workspace.py.
[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/TelemetryWorks/irig106-time"

[workspace.dependencies]
irig106-time = { path = "crates/irig106-time", version = "=0.7.0" }
