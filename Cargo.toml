[package]
name = "irig106-time"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
description = "Precision time interpretation and format conversion for IRIG 106 telemetry data."
repository = "https://github.com/TelemetryWorks/irig106-time"
license = "Apache-2.0"
categories = ["aerospace", "parser-implementations", "no-std"]
keywords = ["irig106", "telemetry", "time", "chapter10", "flight-test"]

[features]
default = ["std"]
std = ["irig106-types/std"]
serde = ["dep:serde", "irig106-types/serde"]
chrono = ["dep:chrono"]

[dependencies]
irig106-types = { version = "0.1", path = "../irig106-types", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
chrono = { version = "0.4", default-features = false, optional = true }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "time_benchmarks"
harness = false

[[bench]]
name = "correlation_bench"
harness = false
