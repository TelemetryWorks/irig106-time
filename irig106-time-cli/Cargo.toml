[package]
name = "irig106-time-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CLI tool for inspecting IRIG 106 Chapter 10 time data — summary, correlation, jump detection, and CSV export."
license.workspace = true
repository.workspace = true
# S15b gate: no CLI publication until S16b bounded streaming is complete.
publish = false

# Keep the extraction review bounded; S16a3 renames the library source lib.rs.
autobins = false

[lib]
path = "src/main.rs"

[[bin]]
name = "irigtime"
path = "src/bin/irigtime.rs"

[dependencies]
irig106-time = { path = "..", version = "=0.7.0" }
