[package]
name = "irig106-time-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CLI tool for inspecting IRIG 106 Chapter 10 time data — summary, correlation, jump detection, and CSV export."
license.workspace = true
repository.workspace = true
# Publishing remains disabled until the owner’s S20 decision.
publish = false

autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "irigtime"
path = "src/bin/irigtime.rs"

[dependencies]
irig106-time = { path = "..", version = "=0.7.0" }

# Owner-approved 2026-11-20: CLI JSON output only (ADR-0019).
serde_json = "1"
