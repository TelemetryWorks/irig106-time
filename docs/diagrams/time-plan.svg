<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="The plan for irig106-time, documentation first: record the decisions as ADRs, revise the architecture against the contract, and rewrite the requirements; the owner reviews them and decides whether to refactor in place or rebuild; tests for every finding and the worked example are written first; irig106-types is fixed and published; the crate's modules are fixed, reworked, or moved; the new capabilities — the time timeline, the policy, the basis — are added; finally the workspace and the irig106-time-cli sub-crate are restructured.">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #1f2328; }
    .t { font-size: 15px; font-weight: 600; }
    .b { font-weight: 600; }
    .l { font-size: 11px; fill: #57606a; }
    .n { font-size: 13px; font-weight: 700; fill: #0969da; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.2; }
    .doc { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.4; }
    .gate { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.4; }
    .oth { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.1; stroke-dasharray: 4 3; }
    .ln { stroke: #57606a; stroke-width: 1.3; fill: none; }
    .ah { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; } .l { fill: #9198a1; } .n { fill: #4493f8; }
      .box, .oth { fill: #161b22; stroke: #9198a1; } .doc { fill: #0c2d6b; stroke: #4493f8; }
      .gate { fill: #3b2e00; stroke: #d29922; } .ln { stroke: #9198a1; } .ah { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="t" x="20" y="30">The plan for irig106-time, documentation first</text>
  <text class="l" x="20" y="48">Each step finishes, and is reviewed where marked, before the next begins.</text>

  <rect class="doc" x="20" y="70" width="290" height="130" rx="8"/>
  <text class="n" x="34" y="94">1</text><text class="b" x="54" y="94">Decide and document</text>
  <text class="l" x="54" y="114">ADRs for the decisions so far</text>
  <text class="l" x="54" y="130">the architecture revised against this</text>
  <text class="l" x="54" y="144">contract (timeline, policy, basis)</text>
  <text class="l" x="54" y="160">L1 rewritten, citing 106-24R1;</text>
  <text class="l" x="54" y="174">L2 and L3 after the review</text>

  <rect class="gate" x="355" y="96" width="190" height="78" rx="8"/>
  <text class="b" x="450" y="118" text-anchor="middle">Owner review</text>
  <text class="l" x="450" y="138" text-anchor="middle">refactor in place,</text>
  <text class="l" x="450" y="152" text-anchor="middle">or rebuild (like irig106-tmats)?</text>

  <rect class="box" x="590" y="70" width="390" height="130" rx="8"/>
  <text class="n" x="604" y="94">2</text><text class="b" x="624" y="94">Tests first</text>
  <text class="l" x="624" y="114">a failing test for each finding T-1 to T-12</text>
  <text class="l" x="624" y="130">the worked example (section 7), byte for byte</text>
  <text class="l" x="624" y="144">spec-sourced fixtures from Chapter 11's figures</text>
  <text class="l" x="624" y="160">markers for the rewritten requirements</text>

  <rect class="box" x="20" y="240" width="290" height="120" rx="8"/>
  <text class="n" x="34" y="264">3</text><text class="b" x="54" y="264">Fix the shared vocabulary</text>
  <text class="l" x="54" y="284">irig106-types: ERTC at 1 ns; source 3</text>
  <text class="l" x="54" y="298">reserved; FMT NONE; ITS; the two</text>
  <text class="l" x="54" y="312">version code lists; then publish it</text>
  <text class="l" x="54" y="328">(CI stops failing on the path dependency)</text>

  <rect class="box" x="355" y="240" width="290" height="120" rx="8"/>
  <text class="n" x="369" y="264">4</text><text class="b" x="389" y="264">Fix, rework, or move each module</text>
  <text class="l" x="389" y="284">as the assessment of 8.3 says:</text>
  <text class="l" x="389" y="298">flags, Format 2, bodies, Chapter 4</text>
  <text class="l" x="389" y="312">time; recording events move to</text>
  <text class="l" x="389" y="326">irig106-decode</text>

  <rect class="box" x="690" y="240" width="290" height="120" rx="8"/>
  <text class="n" x="704" y="264">5</text><text class="b" x="724" y="264">Add what the contract needs</text>
  <text class="l" x="724" y="284">the time timeline and sessions; the time</text>
  <text class="l" x="724" y="298">policy; answers with their basis; the</text>
  <text class="l" x="724" y="312">TMATS reading register; time words from</text>
  <text class="l" x="724" y="326">data; the year sources</text>

  <rect class="box" x="20" y="390" width="625" height="56" rx="8"/>
  <text class="n" x="34" y="414">6</text><text class="b" x="54" y="414">Restructure</text>
  <text class="l" x="54" y="432">one workspace in lockstep; irig106-time-cli as library and binary irigtime; `irig106 time` in irig106-cli</text>

  <rect class="oth" x="690" y="390" width="290" height="56" rx="8"/>
  <text class="b" x="704" y="412">Alongside, elsewhere</text>
  <text class="l" x="704" y="430">RCC 200 into the standards archive</text>

  <path class="ln" d="M310,135 L355,135" marker-end="url(#a)"/>
  <path class="ln" d="M545,135 L590,135" marker-end="url(#a)"/>
  <path class="ln" d="M785,200 L785,220 L165,220 L165,240" marker-end="url(#a)"/>
  <path class="ln" d="M310,300 L355,300" marker-end="url(#a)"/>
  <path class="ln" d="M645,300 L690,300" marker-end="url(#a)"/>
  <path class="ln" d="M835,360 L835,375 L332,375 L332,390" marker-end="url(#a)"/>
</svg>
