<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="Time over a recording: time channel 1, declared external, gives references once a second; its source falls to internal when lock is lost, a gap of three seconds follows, and when lock is regained its time jumps; time channel 2 gives internal references throughout; data packets fall between them; a counter reset starts a new session, and no reference crosses it.">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #1f2328; }
    .t { font-size: 15px; font-weight: 600; }
    .b { font-weight: 600; }
    .l { font-size: 11px; fill: #57606a; }
    .rt { font-size: 11px; fill: #cf222e; }
    .ext { fill: #0969da; } .int { fill: #9a6700; } .gry { fill: #8c959f; }
    .ax { stroke: #57606a; stroke-width: 1.6; fill: none; }
    .lane { stroke: #d0d7de; stroke-width: 1; }
    .tick { stroke: #57606a; stroke-width: 1; }
    .rs { stroke: #cf222e; stroke-width: 1.6; stroke-dasharray: 5 3; fill: none; }
    .gp { fill: #ffebe9; stroke: #cf222e; stroke-width: 1; stroke-dasharray: 3 3; }
    .ah { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; } .l { fill: #9198a1; } .rt { fill: #f85149; }
      .ext { fill: #4493f8; } .int { fill: #d29922; } .gry { fill: #6e7681; }
      .ax, .tick { stroke: #9198a1; } .lane { stroke: #30363d; } .rs { stroke: #f85149; }
      .gp { fill: #3d1214; stroke: #f85149; } .ah { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="t" x="20" y="30">Time over a recording</text>
  <text class="l" x="20" y="48">Each dot is a time packet (a reference point); each tick is a data packet. Illustrative, one second between references.</text>

  <!-- lanes -->
  <text class="b" x="20" y="124">Time channel 1</text><text class="l" x="20" y="139">declared external</text>
  <line class="lane" x1="200" y1="124" x2="960" y2="124"/>
  <text class="b" x="20" y="194">Time channel 2</text><text class="l" x="20" y="209">internal clock</text>
  <line class="lane" x1="200" y1="194" x2="960" y2="194"/>
  <text class="b" x="20" y="258">Data packets</text>
  <line class="lane" x1="200" y1="254" x2="960" y2="254"/>

  <!-- channel 1 -->
  <circle class="ext" cx="220" cy="124" r="6"/><circle class="ext" cx="270" cy="124" r="6"/><circle class="ext" cx="320" cy="124" r="6"/><circle class="ext" cx="370" cy="124" r="6"/>
  <circle class="int" cx="420" cy="124" r="6"/><circle class="int" cx="470" cy="124" r="6"/><circle class="int" cx="520" cy="124" r="6"/>
  <rect class="gp" x="530" y="112" width="130" height="24" rx="4"/>
  <circle class="ext" cx="670" cy="124" r="6"/><circle class="ext" cx="720" cy="124" r="6"/>
  <circle class="ext" cx="820" cy="124" r="6"/><circle class="ext" cx="870" cy="124" r="6"/><circle class="ext" cx="920" cy="124" r="6"/>
  <text class="l" x="420" y="100" text-anchor="middle">lock lost: SRC 0x1 → 0x0</text>
  <text class="rt" x="595" y="100" text-anchor="middle">no time packet for 3 s</text>
  <text class="l" x="690" y="160" text-anchor="middle">lock regained: time jumps</text>

  <!-- channel 2 -->
  <circle class="gry" cx="220" cy="194" r="6"/><circle class="gry" cx="270" cy="194" r="6"/><circle class="gry" cx="320" cy="194" r="6"/><circle class="gry" cx="370" cy="194" r="6"/><circle class="gry" cx="420" cy="194" r="6"/><circle class="gry" cx="470" cy="194" r="6"/><circle class="gry" cx="520" cy="194" r="6"/><circle class="gry" cx="570" cy="194" r="6"/><circle class="gry" cx="620" cy="194" r="6"/><circle class="gry" cx="670" cy="194" r="6"/><circle class="gry" cx="720" cy="194" r="6"/>
  <circle class="gry" cx="820" cy="194" r="6"/><circle class="gry" cx="870" cy="194" r="6"/><circle class="gry" cx="920" cy="194" r="6"/>

  <!-- data ticks -->
  <path class="tick" d="M212,246 L212,262 M232,246 L232,262 M248,246 L248,262 M262,246 L262,262 M286,246 L286,262 M298,246 L298,262 M312,246 L312,262 M336,246 L336,262 M352,246 L352,262 M362,246 L362,262 M384,246 L384,262 M402,246 L402,262 M436,246 L436,262 M452,246 L452,262 M486,246 L486,262 M502,246 L502,262 M536,246 L536,262 M552,246 L552,262 M586,246 L586,262 M602,246 L602,262 M636,246 L636,262 M652,246 L652,262 M686,246 L686,262 M702,246 L702,262 M736,246 L736,262 M752,246 L752,262 M806,246 L806,262 M836,246 L836,262 M852,246 L852,262 M886,246 L886,262 M902,246 L902,262 M936,246 L936,262"/>

  <!-- axis and reset -->
  <path class="ax" d="M200,300 L960,300" marker-end="url(#a)"/>
  <text class="l" x="900" y="318">RTC</text>
  <path class="rs" d="M770,86 L770,308"/>
  <text class="rt" x="778" y="330">counter reset: session 2 —</text>
  <text class="rt" x="778" y="344">no reference crosses it</text>
  <text class="l" x="210" y="330">session 1</text>

  <!-- key -->
  <circle class="ext" cx="26" cy="378" r="6"/><text class="l" x="40" y="382">external, locked</text>
  <circle class="int" cx="176" cy="378" r="6"/><text class="l" x="190" y="382">reported internal (lock lost)</text>
  <circle class="gry" cx="376" cy="378" r="6"/><text class="l" x="390" y="382">internal clock</text>
  <text class="l" x="20" y="410">A data packet is read with a reference of the time channel chosen for its session, and its answer says which reference, how far away, and from what source (sections 3.1, 5.2).</text>
</svg>
