<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-label="Which crate depends on which, as decided. irig106-time, irig106-tmats, and irig106-core each depend on irig106-types. irig106-decode depends on irig106-types, irig106-tmats, and irig106-time. irig106-time-cli depends on irig106-time, irig106-tmats-cli on irig106-tmats, and irig106-cli on both CLI crates. irig106-ch10-reader, irig106-studio, irig106-index, and irig106-write use irig106-time; their other dependencies are not yet decided. Decided non-dependencies: irig106-time does not depend on irig106-tmats, irig106-core, or irig106-decode; irig106-tmats does not depend on irig106-time; irig106-core does not depend on irig106-tmats.">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #1f2328; }
    .t { font-size: 15px; font-weight: 600; }
    .b { font-weight: 600; }
    .l { font-size: 11px; fill: #57606a; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.2; }
    .me { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.6; }
    .cli { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.2; }
    .oth { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.1; stroke-dasharray: 4 3; }
    .leg { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
    .ln { stroke: #57606a; stroke-width: 1.3; fill: none; }
    .us { stroke: #8c959f; stroke-width: 1.2; fill: none; stroke-dasharray: 5 3; }
    .ah { fill: #57606a; } .ahu { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; } .l { fill: #9198a1; }
      .box, .oth { fill: #161b22; stroke: #9198a1; } .leg { fill: #0d1117; stroke: #6e7681; }
      .me { fill: #0f2e1a; stroke: #3fb950; } .cli { fill: #0c2d6b; stroke: #4493f8; }
      .ln { stroke: #9198a1; } .us { stroke: #6e7681; } .ah { fill: #9198a1; } .ahu { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahu" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="t" x="20" y="30">Which crate depends on which, as decided</text>
  <text class="l" x="20" y="48">An arrow points from a crate to a crate it depends on. Only decided dependencies are drawn (contract section 2.4; ADR-0005, 0007; irig106-tmats ADR-0030).</text>

  <!-- top: irig106-cli -->
  <rect class="cli" x="420" y="70" width="180" height="42" rx="7"/>
  <text class="b" x="510" y="89" text-anchor="middle">irig106-cli</text>
  <text class="l" x="510" y="104" text-anchor="middle">the ecosystem's command line</text>

  <!-- row 2 -->
  <rect class="cli" x="160" y="190" width="180" height="42" rx="7"/>
  <text class="b" x="250" y="209" text-anchor="middle">irig106-tmats-cli</text>
  <text class="l" x="250" y="224" text-anchor="middle">binary tmats</text>
  <rect class="box" x="420" y="190" width="180" height="42" rx="7"/>
  <text class="b" x="510" y="209" text-anchor="middle">irig106-decode</text>
  <text class="l" x="510" y="224" text-anchor="middle">data-type bodies, values</text>
  <rect class="cli" x="640" y="190" width="180" height="42" rx="7"/>
  <text class="b" x="730" y="209" text-anchor="middle">irig106-time-cli</text>
  <text class="l" x="730" y="224" text-anchor="middle">binary irigtime</text>

  <!-- row 3 -->
  <rect class="box" x="60" y="330" width="180" height="42" rx="7"/>
  <text class="b" x="150" y="349" text-anchor="middle">irig106-core</text>
  <text class="l" x="150" y="364" text-anchor="middle">files and packets</text>
  <rect class="box" x="300" y="330" width="180" height="42" rx="7"/>
  <text class="b" x="390" y="349" text-anchor="middle">irig106-tmats</text>
  <text class="l" x="390" y="364" text-anchor="middle">the setup record</text>
  <rect class="me" x="540" y="330" width="180" height="42" rx="7"/>
  <text class="b" x="630" y="349" text-anchor="middle">irig106-time</text>
  <text class="l" x="630" y="364" text-anchor="middle">time, with its basis</text>

  <!-- bottom -->
  <rect class="box" x="400" y="470" width="200" height="42" rx="7"/>
  <text class="b" x="500" y="489" text-anchor="middle">irig106-types</text>
  <text class="l" x="500" y="504" text-anchor="middle">shared values</text>

  <!-- edges -->
  <path class="ln" d="M480,112 L300,188" marker-end="url(#a)"/>
  <path class="ln" d="M540,112 L700,188" marker-end="url(#a)"/>
  <path class="ln" d="M250,232 L360,328" marker-end="url(#a)"/>
  <path class="ln" d="M730,232 L660,328" marker-end="url(#a)"/>
  <path class="ln" d="M470,232 L410,328" marker-end="url(#a)"/>
  <path class="ln" d="M550,232 L610,328" marker-end="url(#a)"/>
  <path class="ln" d="M510,232 L510,468" marker-end="url(#a)"/>
  <path class="ln" d="M150,372 L400,480" marker-end="url(#a)"/>
  <path class="ln" d="M420,372 L470,468" marker-end="url(#a)"/>
  <path class="ln" d="M600,372 L550,468" marker-end="url(#a)"/>

  <!-- consumers of time -->
  <text class="b" x="770" y="258">Also use irig106-time</text>
  <rect class="oth" x="770" y="268" width="140" height="30" rx="6"/><text class="l" x="840" y="287" text-anchor="middle">irig106-ch10-reader</text>
  <rect class="oth" x="770" y="306" width="140" height="30" rx="6"/><text class="l" x="840" y="325" text-anchor="middle">irig106-studio</text>
  <rect class="oth" x="770" y="344" width="140" height="30" rx="6"/><text class="l" x="840" y="363" text-anchor="middle">irig106-index</text>
  <rect class="oth" x="770" y="382" width="140" height="30" rx="6"/><text class="l" x="840" y="401" text-anchor="middle">irig106-write</text>
  <path class="us" d="M770,283 L722,340" marker-end="url(#u)"/>
  <path class="us" d="M770,321 L722,348" marker-end="url(#u)"/>
  <path class="us" d="M770,359 L722,356" marker-end="url(#u)"/>
  <path class="us" d="M770,397 L722,364" marker-end="url(#u)"/>
  <text class="l" x="770" y="430">other dependencies not yet decided</text>

  <!-- legend: non-dependencies -->
  <rect class="leg" x="640" y="450" width="340" height="104" rx="6"/>
  <text class="b" x="652" y="470">Decided: no dependency</text>
  <text class="l" x="652" y="489">irig106-time ↛ tmats, core, decode (ADR-0005)</text>
  <text class="l" x="652" y="505">irig106-tmats ↛ time (contract section 2.4)</text>
  <text class="l" x="652" y="521">irig106-core ↛ tmats (irig106-tmats ADR-0030)</text>
  <text class="l" x="652" y="541">Plain data crosses through irig106-types instead.</text>
</svg>
