[package]
name = "irig106-time"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Precision time interpretation and format conversion for IRIG 106 telemetry data."
repository.workspace = true
license.workspace = true
categories = ["aerospace", "parser-implementations", "no-std"]
keywords = ["irig106", "telemetry", "time", "chapter10", "flight-test"]

[features]
default = ["std"]
std = ["irig106-types/std"]
jiff = ["dep:jiff"]

[dependencies]
irig106-types = { version = "0.1", default-features = false }

jiff = { version = "1", default-features = false, optional = true }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "time_benchmarks"
harness = false

[[bench]]
name = "correlation_bench"
harness = false
